name: Deploy Astro Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Public anon keys only — still required at Astro build so client bundles get real values.
      # Set repo secrets: PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_PUBLISHABLE_KEY
      - name: Write public Astro env for build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing PUBLIC_SUPABASE_URL or PUBLIC_SUPABASE_PUBLISHABLE_KEY repo secrets."
            exit 1
          fi
          printf 'PUBLIC_SUPABASE_URL=%s\nPUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$PUBLIC_SUPABASE_URL" \
            "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" > site/.env
          git add -f site/.env

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build site with Nix
        run: nix build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: result/share/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
